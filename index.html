<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoStream - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">🐱 NekoStream</a></h1>
            <p>Streaming Anime Sub Indo Gratis</p>
        </div>
    </header>

    <main class="container">
        <!-- SEARCH BAR -->
        <div class="search-bar-container">
            <form action="search.html" method="GET" class="search-form">
                <input type="text" name="q" placeholder="Mau nonton anime apa hari ini?" required>
                <button type="submit">🔍 Cari</button>
            </form>
        </div>

        <!-- LANJUT NONTON (HISTORY) -->
        <section id="history-section" style="display: none;">
            <h2>🕒 Lanjut Nonton</h2>
            <div id="history-list" class="anime-grid"></div>
        </section>

        <!-- PALING POPULER -->
        <section id="popular-section">
            <h2>🔥 Paling Populer</h2>
            <div id="popular-list" class="anime-grid">
                <p class="loading">Memuat data...</p>
            </div>
        </section>

        <!-- RILIS TERBARU -->
        <section id="latest-section">
            <h2>🆕 Rilis Terbaru</h2>
            <div id="latest-list" class="anime-grid">
                <p class="loading">Memuat data...</p>
            </div>
            <div id="pagination" class="pagination"></div>
        </section>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 NekoStream.</p></div>
    </footer>

    <script src="config.js"></script>
    <script src="home.js"></script>
</body>
</html>
