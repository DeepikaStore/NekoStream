<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Anime - NekoStream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">🐱 NekoStream</a></h1>
            <p>Pencarian Anime</p>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">← Kembali ke Home</a>

        <div class="search-bar-container">
            <form id="search-form" class="search-form">
                <input type="text" id="search-input" placeholder="Ketik judul anime..." required>
                <button type="submit">🔍 Cari</button>
            </form>
        </div>

        <!-- LIST GENRE -->
        <section id="genre-section">
            <h2>🗂️ Kategori Genre</h2>
            <div id="genre-list" class="genre-grid">
                <p class="loading">Memuat genre...</p>
            </div>
        </section>

        <!-- HASIL PENCARIAN -->
        <section id="result-section" style="display: none;">
            <h2 id="result-title">Hasil Pencarian</h2>
            <div id="result-list" class="anime-grid"></div>
            <div id="search-pagination" class="pagination"></div>
        </section>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 NekoStream.</p></div>
    </footer>

    <script src="config.js"></script>
    <script src="search.js"></script>
</body>
</html>
